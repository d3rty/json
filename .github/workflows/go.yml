name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      # Cheap cross-compile check: catches wasm breakage without a js runner.
      - name: Build (js/wasm)
        run: GOOS=js GOARCH=wasm go build ./cmd/wasm-demo
